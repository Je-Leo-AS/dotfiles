wtf:
  colors:
    border:
      focusable: steelblue
      focused: orange
      normal: gray
  grid:
    columns: [38, 38, 38, 38]
    rows: [9, 9, 9, 9, 9]
  refreshInterval: 1s
  mods:
    rclone:
      type: cmdrunner
      title: "Rclone"
      cmd: "wtf-rclone-status"
      enabled: true
      refreshInterval: 30s
      maxLines: 80
      position:
        top: 0
        left: 0
        height: 3
        width: 1
    tuxedo:
      type: cmdrunner
      title: "Tuxedo"
      cmd: "wtf-tuxedo-tasks"
      enabled: true
      refreshInterval: 30s
      maxLines: 60
      position:
        top: 3
        left: 0
        height: 2
        width: 4
    rclone_logs:
      type: cmdrunner
      title: "Rclone logs"
      cmd: "bash"
      args:
        - "-lc"
        - "for f in ~/rclone-*.log ~/.cache/com.rclone.manager/logs/rclone/main_engine.log; do [ -f \"$f\" ] && tail -n 8 \"$f\" | sed \"s#^#$(basename \"$f\"): #\"; done | tail -40"
      enabled: true
      refreshInterval: 20s
      maxLines: 80
      tail: true
      position:
        top: 0
        left: 1
        height: 3
        width: 3
